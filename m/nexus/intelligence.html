  /* ---- Markdown renderer ---- */
  function inlineMd(s){
    s = esc(s);
    // links [text](url)
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // auto bare urls
    s = s.replace(/(^|[\s(])((https?:\/\/)[^\s<]+)/g, function(_, pre, url){

      var line = lines[i];

      if(/^%%PART\d+%%$/.test(t)){

      }
      if(/^###\s+/.test(line)){ html += "<h3>"+inlineMd(line.replace(/^###\s+/,""))+"</h3>"; i++; continue; }
      if(/^##\s+/.test(line)){ html += "<h2>"+inlineMd(line.replace(/^##\s+/,""))+"</h2>"; i++; continue; }
      if(/^#\s+/.test(line)){ html += "<h1>"+inlineMd(line.replace(/^#\s+/,""))+"</h1>"; i++; continue; }
      if(/^>\s?/.test(line)){
        var q = [];
        while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/, "")); i++; }
        html += "<blockquote>"+inlineMd(q.join(" "))+"</blockquote>";

      // table
      if(t.indexOf("|") !== -1 && t.charAt(0) === "|"){
        var rows = [];
        while(i<lines.length && lines[i].indexOf("|") !== -1){
          rows.push(lines[i]); i++;

        html += renderTable(rows);

      }
      // lists
      if(/^[-*]\s+/.test(line)){
        html += "<ul>";
        while(i<lines.length && /^[-*]\s+/.test(lines[i])){
          html += "<li>"+inlineMd(lines[i].replace(/^[-*]\s+/,""))+"</li>"; i++;
        }

      }
      if(/^\d+\.\s+/.test(line)){
        html += "<ol>";
        while(i<lines.length && /^\d+\.\s+/.test(lines[i])){

        }
        html += "</ol>"; continue;

      if(t === ""){ i++; continue; }
      // paragraph: merge soft-wrapped lines

    return html || "<p></p>";
  }

  function renderTable(rows){
    var parsed = rows.map(function(r){
      return r.split("|").map(function(c){return c.trim();}).filter(function(c,i,a){ return !(i===0&&c==="") && !(i===a.length-1&&c===""); });
    }).filter(function(cells){ return cells.length; });
    if(parsed.length < 1) return "";
    // drop separator row
    var body = parsed.filter(function(cells, idx){
      if(idx===0) return true;
      return !cells.every(function(c){ return /^:?-+:?$/.test(c); });
    });
    if(!body.length) return "";
    var head = body[0];
    var out = '<div class="table-wrap"><table><thead><tr>';
    head.forEach(function(c){ out += "<th>"+inlineMd(c)+"</th>"; });
    out += "</tr></thead><tbody>";
    for(var r=1;r<body.length;r++){
      out += "<tr>";
      for(var c=0;c<head.length;c++){
        out += "<td>"+inlineMd(body[r][c]||"")+"</td>";
      }
      out += "</tr>";
    }
    out += "</tbody></table></div>";
    return out;
  }

  function addMsg(role, text){
    var wrap = document.createElement("div");
    wrap.className = "msg "+(role==="user"?"user":"ai");
    if(role==="user"){
      wrap.innerHTML = '<div class="bubble"></div>';
      wrap.querySelector(".bubble").textContent = text;
    } else {
      wrap.innerHTML = '<div class="bubble"><div class="who">NexusAI v1</div><div class="md"></div></div>';
      wrap.querySelector(".md").innerHTML = renderMd(text);
    }
    // insert before typing indicator's place — typing is outside scroll, so just append
    scroll.appendChild(wrap);
    scroll.scrollTop = scroll.scrollHeight;
  }

  function setBusy(v){
    busy = v;
    sendBtn.disabled = v;
    typing.classList.toggle("on", v);
    if(v){ scroll.appendChild(typing); scroll.scrollTop = scroll.scrollHeight; }
  }

  // move typing into scroll flow visually
  typing.style.alignSelf = "flex-start";
  typing.style.margin = "0 0 4px";

  function send(text){
    text = (text || input.value || "").trim();
    if(!text || busy) return;
    input.value = "";
    autosize();
    addMsg("user", text);
    history.push({role:"user", content:text});
    setBusy(true);

    fetch(BASE + "/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},
      body:JSON.stringify({model:MODEL, messages:history, temperature:0.55, max_tokens:2500})
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok){
          var m = (data && data.error && (data.error.message||data.error)) || data.message || ("HTTP "+res.status);
          throw new Error(typeof m === "string" ? m : JSON.stringify(m));
        }
        return data;
      });
    }).then(function(data){
      var reply = "";
      try{ reply = data.choices[0].message.content || ""; }catch(e){ throw new Error("Пустой ответ"); }
      history.push({role:"assistant", content:reply});
      if(history.length > 24) history = [history[0]].concat(history.slice(-22));
      addMsg("assistant", reply);
    }).catch(function(err){
      showErr("NexusAI: "+(err.message||"сбой сети"));
      addMsg("assistant", "## Сбой связи\n\n**Не удалось получить ответ.** Попробуй ещё раз или зайди в [Discord](https://discord.gg/gRdeVkG5vf).");
    }).finally(function(){ setBusy(false); });
  }

  function autosize(){
    input.style.height = "auto";
    input.style.height = Math.min(160, Math.max(52, input.scrollHeight))+"px";
  }
  sendBtn.addEventListener("click", function(){ send(); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  document.getElementById("chips").addEventListener("click", function(e){
    var b = e.target.closest("button[data-q]");
    if(b) send(b.getAttribute("data-q"));
  });
  var menu=document.querySelector(".menu"), links=document.querySelector(".links");
  if(menu&&links){
    menu.addEventListener("click", function(e){ e.stopPropagation(); links.classList.toggle("open"); });
    document.addEventListener("click", function(e){ if(!links.contains(e.target)&&e.target!==menu) links.classList.remove("open"); });
  }
})();
</script>
</body>
</html>
