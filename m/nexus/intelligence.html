  function renderMd(text) {
    var lines = String(text || '').split('\n');
    var html = '';
    var inTable = false;
    var tableRows = [];

    function flushTable() {
      if (!tableRows.length) return;
      html += '<table>';
      tableRows.forEach(function (row, idx) {
        var cells = row.split('|').map(function (c) { return c.trim(); }).filter(function (c, i, a) {
          return c.length || (i > 0 && i < a.length - 1);
        });
        // skip separator |---|
        if (cells.every(function (c) { return /^[\-:]+$/.test(c); })) return;
        var tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(function (c) {
          return '<' + tag + '>' + inlineFormat(c) + '</' + tag + '>';
        }).join('') + '</tr>';
      });
      html += '</table>';
      tableRows = [];
      inTable = false;
    }

    function inlineFormat(s) {
      // **key** frames
      s = s.replace(/\*\*(.+?)\*\*/g, '<span class="hl-frame">$1</span>');
      s = s.replace(/`([^`]+)`/g, '<code style="font-family:JetBrains Mono,monospace;font-size:0.85em;background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:6px">$1</code>');
      return s;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.indexOf('|') !== -1 && line.trim().charAt(0) === '|') {
        inTable = true;
        tableRows.push(line);
        continue;
      } else if (inTable) {
        flushTable();
      }
      if (/^#\s+/.test(line)) {
        html += '<h1 class="md-h1">' + inlineFormat(line.replace(/^#\s+/, '')) + '</h1>';
      } else if (/^##\s+/.test(line)) {
        html += '<h2 class="md-h2">' + inlineFormat(line.replace(/^##\s+/, '')) + '</h2>';
      } else if (/^[-*]\s+/.test(line)) {
        // collect list
        html += '<ul>';
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          html += '<li>' + inlineFormat(lines[i].replace(/^[-*]\s+/, '')) + '</li>';
          i++;
        }
        i--;
        html += '</ul>';
      } else if (line.trim() === '') {
        html += '';
      } else {
        html += '<p>' + inlineFormat(line) + '</p>';
      }
    }
    flushTable();
    return html || '<p></p>';
  }

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    if (role === 'assistant') {
      div.innerHTML = '<div class="who">NexusAI v1</div><div class="content">' + renderMd(text) + '</div>';
    } else {
      div.innerHTML = '<div class="content"><p></p></div>';
      div.querySelector('p').textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    typing.classList.toggle('on', v);
  }

  function send(text) {
    text = (text || input.value || '').trim();
    if (!text || busy) return;
    input.value = '';
    autoSize();
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    setBusy(true);

    fetch(BASE + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        temperature: 0.6,
        max_tokens: 2048
      })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          var msg = (data && (data.error && data.error.message || data.message)) || ('Ошибка API ' + res.status);
          throw new Error(msg);
        }
        return data;
      });
    }).then(function (data) {
      var reply = '';
      try {
        reply = data.choices[0].message.content || '';
      } catch (e) {
        throw new Error('Пустой ответ модели');
      }
      // force identity if model drifts
      if (!/NexusAI/i.test(reply) && reply.length < 40) {
        reply = 'NexusAI v1: ' + reply;
      }
      history.push({ role: 'assistant', content: reply });
      // trim history growth (keep system + last 20)
      if (history.length > 22) {
        history = [history[0]].concat(history.slice(-20));
      }
      addMsg('assistant', reply);
    }).catch(function (err) {
      showErr('NexusAI: ' + (err.message || 'не удалось получить ответ. Попробуй ещё раз.'));
      addMsg('assistant', '**Временный сбой связи.**\n\nПопробуй повторить запрос через несколько секунд. Если ошибка повторяется — напиши в Discord проекта.');
    }).finally(function () {
      setBusy(false);
    });
  }

  function autoSize() {
    input.style.height = 'auto';
    input.style.height = Math.min(140, input.scrollHeight) + 'px';
  }

  sendBtn.addEventListener('click', function () { send(); });
  input.addEventListener('input', autoSize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.getElementById('suggest').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-q]');
    if (b) send(b.getAttribute('data-q'));
  });

  // mobile menu
  var btn = document.querySelector('.menu');
  var links = document.querySelector('.links');
  if (btn && links) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      links.classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
      if (!links.contains(e.target) && e.target !== btn) links.classList.remove('open');
    });
  }
})();
  </script>
</body>
</html>
