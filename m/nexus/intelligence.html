:root{--bg:#05040a;--text:#f4f0ff;--muted:#9b93b3;--gold:#e8c87a;--line:rgba(255,255,255,.12);--ai:#7dd3fc}

.panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden}

.typing{display:none;align-self:flex-start;gap:6px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05)}.typing.on{display:inline-flex}.typing span{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:b 1.1s ease-in-out infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.35}40%{opacity:1;transform:translateY(-5px)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips button{flex-shrink:0;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--muted);font:600 12px Manrope,sans-serif;cursor:pointer}
.composer{display:flex;gap:10px;align-items:flex-end}.composer textarea{flex:1;min-height:52px;max-height:160px;resize:none;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.4);color:#fff;font:500 15px Manrope,sans-serif;outline:none}
.send{width:52px;height:52px;border:none;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#7dd3fc,#a78bfa 60%,#e8c87a);color:#0a0814;font-size:20px;font-weight:800}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(16px);padding:13px 16px;border-radius:14px;z-index:100;background:rgba(36,10,18,.96);border:1px solid rgba(255,110,130,.45);color:#ffc0c8;font-size:13.5px;font-weight:600;opacity:0;transition:.35s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
